<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="180" y1="60" x2="880" y2="990" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15151d"/>
      <stop offset="0.52" stop-color="#0b0b11"/>
      <stop offset="1" stop-color="#060609"/>
    </linearGradient>
    <linearGradient id="flow" x1="300" y1="800" x2="720" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.34" stop-color="#38BDF8"/>
      <stop offset="0.68" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="450" r="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#7C3AED" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <clipPath id="tile">
      <rect width="1024" height="1024" rx="236"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="512" cy="450" r="440" fill="url(#halo)"/>

    <circle cx="512" cy="512" r="356" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
    <circle cx="512" cy="512" r="400" fill="none" stroke="#8EE7FF" stroke-opacity="0.15" stroke-width="3"
            stroke-linecap="round" stroke-dasharray="1 28"/>

    <g transform="rotate(-6 512 512)">
      <g filter="url(#bloom)" opacity="0.55" fill="none" stroke="url(#flow)" stroke-linecap="round">
        <circle cx="372" cy="512" r="58" fill="url(#flow)" stroke="none"/>
        <path d="M 480 373 A 176 176 0 0 1 480 651" stroke-width="84"/>
        <path d="M 557 276 A 300 300 0 0 1 557 748" stroke-width="84"/>
        <path d="M 633 178 A 424 424 0 0 1 633 846" stroke-width="84"/>
      </g>

      <g fill="none" stroke="url(#flow)" stroke-linecap="round">
        <circle cx="372" cy="512" r="58" fill="url(#flow)" stroke="none"/>
        <path d="M 480 373 A 176 176 0 0 1 480 651" stroke-width="72"/>
        <path d="M 557 276 A 300 300 0 0 1 557 748" stroke-width="72"/>
        <path d="M 633 178 A 424 424 0 0 1 633 846" stroke-width="72"/>
      </g>
    </g>
  </g>

  <rect x="1" y="1" width="1022" height="1022" rx="235" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
</svg>
